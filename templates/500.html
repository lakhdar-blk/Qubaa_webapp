<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #faf7ef; color: #122019;
               display: grid; min-height: 100vh; place-items: center; text-align: center; padding: 24px; }
        h1 { font-size: 1.6rem; margin: 0 0 12px; }
        p { color: #5c6a62; margin: 0; }
        a { display: inline-block; margin-top: 24px; background: #14563b; color: #fff;
            padding: 12px 22px; border-radius: 999px; text-decoration: none; }
    </style>
</head>
<body>
    <div>
        <h1>Something went wrong</h1>
        <p>We are sorry, an unexpected error occurred. Please try again in a moment.</p>
        <a href="/">Back to the website</a>
    </div>
</body>
</html>
